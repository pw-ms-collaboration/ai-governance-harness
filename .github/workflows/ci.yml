name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest

  quality:
    name: Quality and dependency checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --all-extras

      - name: Run Ruff
        run: uv run ruff check .

      - name: Diagnose Agent Governance Toolkit
        env:
          PYTHONUTF8: "1"
        run: uv run agt --json doctor

      - name: Lint governance policy
        env:
          PYTHONUTF8: "1"
        run: >-
          uv run agt --json lint-policy --strict
          src/ai_governance_harness/governance/policies/default.yaml

      - name: Verify governance evidence
        env:
          PYTHONUTF8: "1"
        run: >-
          uv run agt --json verify --evidence
          src/ai_governance_harness/governance/agt-runtime-evidence.yaml

      - name: Build package
        run: uv build

      - name: Generate CycloneDX SBOM
        run: >-
          uv run cyclonedx-py environment
          --pyproject pyproject.toml
          --output-reproducible
          --output-file dist/sbom.cdx.json

      - name: Upload package and SBOM
        uses: actions/upload-artifact@v4
        with:
          name: package-and-sbom
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json

      - name: Audit dependencies
        run: uv run ai-governance-audit
