[project]
name = "ai-governance-harness"
version = "0.1.0"
description = "Harness for AI governance, evaluation, and safety with Azure AI Foundry integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "azure-ai-projects>=1.0.0b1",
    "azure-ai-inference>=1.0.0b1",
    "azure-identity>=1.16.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
