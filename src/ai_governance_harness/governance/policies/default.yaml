apiVersion: governance.toolkit/v1
version: "1.0"
name: ai-governance-harness-default
description: Default-deny policy for the synthetic in-fund governance harness.
agent: ai-governance-harness
scope: global
default_action: deny
rules:
  - name: deny-personal-advice-request
    stage: pre_input
    condition: "action.type == 'chat.input' and data.advice_request_status == 'personal_advice_requested'"
    action: deny
  - name: deny-personal-advice-tool-response
    stage: post_tool
    condition: "data.advice_scan_status == 'personal_advice_detected'"
    action: deny
  - name: allow-agent-startup
    stage: pre_input
    condition: "action.type == 'agent.startup'"
    action: allow
  - name: allow-chat-input
    stage: pre_input
    condition: "action.type == 'chat.input' and data.advice_request_status == 'passed'"
    action: allow
  - name: allow-model-call
    stage: pre_input
    condition: "action.type == 'foundry.chat'"
    action: allow
  - name: allow-model-result
    stage: post_tool
    condition: "action.type == 'foundry.chat'"
    action: allow
  - name: allow-chat-tools
    stage: pre_tool
    condition: "governance.boundary == 'chat' and governance.actor == 'interactive' and action.type in ['get_member_profile', 'get_member_disengagement_signals', 'get_cohort_churn_analytics', 'get_fum_outflow_summary', 'prepare_member_outreach_case']"
    action: allow
  - name: allow-mcp-analyst-aggregates
    stage: pre_tool
    condition: "governance.boundary == 'mcp' and governance.actor == 'interactive' and governance.token_type == 'user' and governance.staff_role == 'analyst' and action.type in ['get_cohort_churn_analytics', 'get_fum_outflow_summary']"
    action: allow
  - name: allow-mcp-retention-tools
    stage: pre_tool
    condition: "governance.boundary == 'mcp' and governance.actor == 'interactive' and governance.token_type == 'user' and governance.staff_role == 'retention_specialist' and action.type in ['get_member_profile', 'get_member_disengagement_signals', 'get_cohort_churn_analytics', 'get_fum_outflow_summary', 'prepare_member_outreach_case']"
    action: allow
  - name: allow-reporting-aggregates
    stage: pre_tool
    condition: "governance.boundary == 'mcp' and governance.actor == 'reporting' and governance.token_type == 'app' and action.type in ['get_cohort_churn_analytics', 'get_fum_outflow_summary']"
    action: allow
  - name: allow-local-analyst-aggregates
    stage: pre_tool
    condition: "governance.boundary == 'local' and governance.staff_role == 'analyst' and action.type in ['get_cohort_churn_analytics', 'get_fum_outflow_summary']"
    action: allow
  - name: allow-local-retention-tools
    stage: pre_tool
    condition: "governance.boundary == 'local' and governance.staff_role == 'retention_specialist' and action.type in ['get_member_profile', 'get_member_disengagement_signals', 'get_cohort_churn_analytics', 'get_fum_outflow_summary', 'prepare_member_outreach_case']"
    action: allow
  - name: allow-member-profile-result
    stage: post_tool
    condition: "action.type == 'get_member_profile' and data.advice_scan_status == 'passed'"
    action: allow
  - name: allow-member-signals-result
    stage: post_tool
    condition: "action.type == 'get_member_disengagement_signals' and data.advice_scan_status == 'passed'"
    action: allow
  - name: allow-cohort-analytics-result
    stage: post_tool
    condition: "action.type == 'get_cohort_churn_analytics' and data.advice_scan_status == 'passed'"
    action: allow
  - name: allow-fum-summary-result
    stage: post_tool
    condition: "action.type == 'get_fum_outflow_summary' and data.advice_scan_status == 'passed'"
    action: allow
  - name: allow-approved-outreach-case-result
    stage: post_tool
    condition: "action.type == 'prepare_member_outreach_case' and data.advice_scan_status == 'passed'"
    action: allow
  - name: allow-chat-output
    stage: pre_output
    condition: "action.type == 'chat.output'"
    action: allow
  - name: deny-out-of-scope-request
    stage: pre_output
    condition: "action.type == 'chat.scope_refusal'"
    action: deny
  - name: allow-agent-shutdown
    stage: pre_output
    condition: "action.type == 'agent.shutdown'"
    action: allow
